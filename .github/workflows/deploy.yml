name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres/Mongo reais: os testes sobem o contexto Spring completo (Room via JPA,
    # ChatMessage via Mongo), e o GitHub Actions publica a porta do service container
    # em localhost por padrao - bate com o que application.properties ja espera, sem
    # precisar sobrescrever spring.datasource.url/spring.data.mongodb.uri.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nullpointertalk
          POSTGRES_USER: nullpointertalk
          POSTGRES_PASSWORD: nullpointertalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nullpointertalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: ./mvnw -B test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_HOST }}
          username: deploy
          key: ${{ secrets.KEY_HOST }}
          script: |
            cd ~/NullPointerTalk
            git pull origin main
            docker compose up -d --build
            docker image prune -f
