# Config do coturn (servidor TURN/STUN) para a Fase 3 - usado so quando o app roda
# com SPRING_PROFILES_ACTIVE=vps (ver application-vps.properties). Em dev local com
# ngrok, STUN publico basta e este servico nem precisa subir.

listening-port=3478
# listening-ip/relay-ip ficam em 0.0.0.0 porque com network_mode: host o container
# enxerga todas as interfaces da VPS diretamente.
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# IMPORTANTE ao hospedar numa VPS: troque pelo IP publico da maquina. Sem isso o
# coturn anuncia candidates com um IP que os clientes de fora nao conseguem alcancar.
external-ip=SEU_IP_PUBLICO_AQUI

realm=nullpointertalk.local

# Credenciais de curta duracao (esquema TURN REST API) em vez de usuario/senha fixos:
# o backend gera username/credential na hora (ver TurnCredentialsService), assinados
# com este mesmo segredo via HMAC-SHA1. Troque o valor abaixo e replique em
# webrtc.turn.secret no application-vps.properties - os dois precisam bater.
use-auth-secret
static-auth-secret=TROQUE_ESTE_SEGREDO

# Faixa de portas UDP pro relay de midia - pequena de proposito, so pra alguns
# amigos testando ao mesmo tempo (cada participante atras de NAT restritivo
# consome uma porta por sessao TURN).
min-port=49160
max-port=49200

# Sem TLS por simplicidade (laboratorio, poucos usuarios confiaveis) - se
# quiser turns:// mais pra frente, remover estas duas linhas e configurar
# cert-file/pkey-file.
no-tls
no-dtls

no-cli
fingerprint
