<!--/*
  Sprite de ícones, inlinado como primeiro filho do <body> do shell.

  Traços em stroke="currentColor" fill="none" (estilo feather): a cor vem do CSS do
  botão que contém o <svg>, então estado (mutado = vermelho, ativo = accent) é só
  trocar a cor do container - sem precisar de um ícone por estado.

  O <svg> raiz usa position:absolute;width:0 em vez de display:none: navegadores já
  tiveram bugs resolvendo <use> cujo ancestral está em display:none, e esse padrão
  não tem esse risco.
*/-->
