<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${room.name()} + ' · NullPointerTalk'">Sala · NullPointerTalk</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="room-body"
      th:attr="data-room-id=${room.id()},data-room-name=${room.name()}">
    <header class="room-header">
        <a href="/" class="btn btn--ghost">← Salas</a>
        <h1>
            <span th:text="${room.icon()}">💬</span>
            <span th:text="${room.name()}">Geral</span>
        </h1>
        <span id="connection-status" class="connection-status">conexão: conectando…</span>
    </header>

    <button id="enable-audio-btn" class="enable-audio-btn hidden" type="button">🔊 Toque para ativar o áudio</button>

    <div id="room-loading" class="room-loading">
        <div class="room-loading__spinner"></div>
        <span>Acessando câmera e microfone…</span>
    </div>

    <div class="room-main">
        <main id="video-grid" class="video-grid">
            <!-- tiles de vídeo são inseridos aqui via room.js -->
        </main>

        <aside id="chat-panel" class="chat-panel hidden">
            <div class="chat-panel__header">
                <span>Chat</span>
                <button id="close-chat" class="chat-panel__close" type="button" title="Fechar chat">×</button>
            </div>
            <div id="chat-messages" class="chat-panel__messages">
                <!-- mensagens são inseridas aqui via room.js -->
            </div>
            <form id="chat-form" class="chat-panel__form">
                <input id="chat-input" type="text" placeholder="Mensagem…" maxlength="500" autocomplete="off">
                <button type="submit" class="btn btn--primary chat-panel__send">Enviar</button>
            </form>
        </aside>
    </div>

    <div class="device-bar">
        <label class="device-select">🎙️
            <select id="mic-select" title="Microfone"></select>
        </label>
        <label class="device-select">📷
            <select id="camera-select" title="Câmera"></select>
        </label>
        <label class="device-select">🔊
            <select id="speaker-select" title="Saída de áudio"></select>
        </label>
    </div>

    <footer class="control-bar">
        <button id="toggle-mic" class="control-btn" type="button" title="Mutar/desmutar microfone">🎤</button>
        <button id="toggle-camera" class="control-btn" type="button" title="Ligar/desligar câmera">📷</button>
        <button id="toggle-screen" class="control-btn" type="button" title="Compartilhar tela">🖥️</button>
        <button id="toggle-listen-along" class="control-btn" type="button" title="Ouvir junto (compartilhar áudio de uma aba)">🎧</button>
        <button id="toggle-chat" class="control-btn" type="button" title="Abrir/fechar chat">💬</button>
        <button id="leave-room" class="control-btn control-btn--danger" type="button" title="Sair da sala">📞</button>
    </footer>

    <script type="module" th:src="@{/js/room.js}"></script>
</body>
</html>
