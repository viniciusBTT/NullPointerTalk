<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NullPointerTalk</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="app-shell">
        <aside class="server-rail">
            <div class="server-icon" title="NullPointerTalk">NPT</div>
        </aside>

        <nav class="channel-sidebar">
            <h1 class="channel-sidebar__title">Salas</h1>
            <ul class="channel-list">
                <li th:each="room : ${rooms}">
                    <a class="channel-link" th:href="@{'/room/' + ${room.id()}}">
                        <span class="channel-link__icon" th:text="${room.icon()}">💬</span>
                        <span class="channel-link__name" th:text="${room.name()}">Geral</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="welcome-panel">
                <h2>Bem-vindo(a), <span id="username-display">visitante</span> 👋</h2>
                <p>Escolha uma sala ao lado para testar transmissão de áudio, vídeo e tela via WebRTC.</p>
                <button id="change-name-btn" class="btn btn--ghost" type="button">Trocar nome</button>
            </div>
        </main>
    </div>

    <div id="name-gate" class="name-gate hidden">
        <form id="name-form" class="name-gate__card">
            <h2>Como podemos te chamar?</h2>
            <p>Sem login, sem senha — só um nome pra identificar você nas salas.</p>
            <input id="name-input" type="text" maxlength="30" placeholder="Seu nome" autocomplete="off" required>
            <button type="submit" class="btn btn--primary">Entrar</button>
        </form>
    </div>

    <script type="module" th:src="@{/js/home.js}"></script>
</body>
</html>
