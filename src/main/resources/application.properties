spring.application.name=backend

# Confia em X-Forwarded-Proto/Host/For de um proxy reverso na frente (ngrok, coturn/VPS na fase 3).
# Sem isso, o handshake do WebSocket de sinalizacao (/ws/signaling) e rejeitado com 403 atras de HTTPS
# tunelado: o Origin do navegador vem "https://...", mas o Tomcat achava que a conexao era "http"
# (ngrok fala HTTP puro com o backend local) - o check de mesma origem do Spring compara esquema tambem.
server.forward-headers-strategy=native

# Fase 1: sem Room/Participant/ChatMessage ainda, so desliga a autoconfig de JPA/Mongo
# (senao o Spring tenta conectar no Postgres/Mongo no boot mesmo sem entidades).
# Remover esta linha quando o chat (STOMP + MongoDB) entrar.
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration

# Postgres (Room, Participant - dados relacionais)
spring.datasource.url=jdbc:postgresql://localhost:5432/nullpointertalk
spring.datasource.username=nullpointertalk
spring.datasource.password=nullpointertalk
spring.jpa.hibernate.ddl-auto=update

# MongoDB (ChatMessage - historico de chat)
spring.data.mongodb.uri=mongodb://localhost:27017/nullpointertalk

# ICE servers para o WebRTC (mesh P2P). STUN publico por padrao.
# Quando for para a VPS, trocar/adicionar um servidor TURN (coturn) aqui.
webrtc.ice-servers[0].urls=stun:stun.l.google.com:19302
