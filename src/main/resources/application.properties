spring.application.name=backend

# Confia em X-Forwarded-Proto/Host/For de um proxy reverso na frente (nginx na VPS, ou ngrok
# em teste local). Sem isso o Spring acha que a conexao e "http" mesmo quando o navegador
# fala "https" com o proxy, o que gera URLs/paginas erradas atras de TLS terminado no proxy.
server.forward-headers-strategy=native

# Postgres (Room - dados relacionais)
spring.datasource.url=jdbc:postgresql://localhost:5432/nullpointertalk
spring.datasource.username=nullpointertalk
spring.datasource.password=nullpointertalk
spring.jpa.hibernate.ddl-auto=update

# MongoDB (ChatMessage - historico de chat)
spring.data.mongodb.uri=mongodb://localhost:27017/nullpointertalk
# Sem isso o Spring Data Mongo NAO cria os indices declarados via @Indexed/@CompoundIndex
# (o padrao e' so validar contra indices ja existentes, nao criar nenhum).
spring.data.mongodb.auto-index-creation=true

# LiveKit (SFU de midia) - servidor local subido via docker-compose (ver livekit/livekit.yaml).
# api-key/api-secret precisam ser identicos ao "keys:" do livekit.yaml - ja vem pronto pra
# funcionar em dev local sem editar nada.
livekit.url=ws://localhost:7880
livekit.api-key=devkey
livekit.api-secret=devsecret_local_apenas_para_desenvolvimento_32

# URL HTTP pras chamadas servidor->servidor na RoomService (a API Twirp fica na MESMA
# porta 7880 da sinalizacao). Vazio = derivado de livekit.url (ws:// -> http://,
# wss:// -> https://), que e o que serve em dev local.
#
# Numa VPS onde app e livekit rodam na mesma maquina (network_mode: host), vale
# sobrescrever esta propriedade com o loopback (http://localhost:7880) direto no
# application-vps.properties daquele ambiente - sem isso o backend derivaria de
# livekit.url e daria a volta pelo DNS publico + nginx + TLS a cada 1,5s so pra falar
# com o processo vizinho.
livekit.api-url=

# Tokens de API (roomList/roomAdmin) sao internos e de uso imediato - nao precisam das
# 24h do token que vai pro navegador.
livekit.api-token-ttl-seconds=300
livekit.http-timeout-ms=3000

# Cache do /api/presence: um lote de chamadas ao LiveKit por janela, independente de
# quantos navegadores estejam fazendo polling. O TTL de falha e maior de proposito, pra
# nao martelar um LiveKit fora do ar (e pra nao pagar o timeout inteiro a cada poll).
livekit.presence-cache-ms=1500
livekit.presence-failure-cache-ms=5000

# Sem cache-busting por hash de conteudo: o resource chain do Spring so reescreve URLs que
# passam pelo @{...} do Thymeleaf, e o "import './media.js'" de um ES module nativo e
# resolvido pelo proprio navegador contra o caminho SEM fingerprint - reescrever isso
# exigiria um build step, que e justamente o que este projeto nao tem. Entao: revalidacao
# obrigatoria. Cada modulo custa um GET condicional que responde 304 sem corpo, e nunca
# ha risco de servir JS velho depois de um deploy.
spring.web.resources.cache.cachecontrol.no-cache=true
