# Perfil ativado na VPS (Fase 3) via SPRING_PROFILES_ACTIVE=vps, junto do coturn
# subido pelo docker-compose. Em dev local com ngrok este perfil nao e usado -
# so STUN publico basta (ver application.properties).

# Troque SEU_DOMINIO_OU_IP pelo endereco publico da VPS (o mesmo que foi
# preenchido em external-ip no coturn/turnserver.conf).
webrtc.turn.urls=turn:SEU_DOMINIO_OU_IP:3478

# Precisa ser identico ao static-auth-secret do coturn/turnserver.conf - e o
# segredo compartilhado usado pra assinar as credenciais TURN de curta duracao
# (ver TurnCredentialsService).
webrtc.turn.secret=TROQUE_ESTE_SEGREDO

# Quanto tempo (em segundos) uma credencial TURN gerada continua valida.
webrtc.turn.ttl-seconds=86400
