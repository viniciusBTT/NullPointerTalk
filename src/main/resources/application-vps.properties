# Perfil ativado na VPS via SPRING_PROFILES_ACTIVE=vps, junto do LiveKit subido
# pelo docker-compose (livekit/livekit.yaml, network_mode: host). Em dev local
# este perfil nao e usado (ver application.properties, ja funciona sozinho).

# Aponte pro subdominio que o nginx da VPS expoe com TLS pra porta 7880 do LiveKit
# (ex: wss://livekit.SEUDOMINIO). Precisa ser wss:// (nao ws://) em producao -
# navegador bloqueia WebSocket inseguro numa pagina servida por HTTPS.
livekit.url=wss://livekit.SEUDOMINIO

# Precisam ser identicos ao par em "keys:" do livekit.yaml - e o segredo
# compartilhado usado pra assinar/validar os tokens de acesso (ver LiveKitTokenService).
# Troque os dois valores abaixo (aqui E no livekit.yaml) antes de subir na VPS.
livekit.api-key=TROQUE_ESTA_API_KEY
livekit.api-secret=TROQUE_ESTE_SEGREDO_COM_PELO_MENOS_32_CARACTERES
