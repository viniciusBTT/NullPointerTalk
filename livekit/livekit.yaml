# Config do LiveKit (servidor de midia SFU) - substitui o coturn: virou o unico
# componente que fala UDP/RTP de verdade, sinalizacao e TURN embutido no mesmo
# processo. Rodando com network_mode: host (igual o coturn antes), ve as
# interfaces da maquina direto.

port: 7880          # WS/HTTP de sinalizacao - e' o que o backend Java (LiveKitTokenService)
                     # aponta em livekit.url e o cliente conecta via room.connect()
rtc:
  tcp_port: 7881     # fallback ICE-TCP para redes que bloqueiam UDP
  port_range_start: 50000
  port_range_end: 60000
  node_ip: 76.13.67.68   # IP publico fixo da VPS. Fixado a mao porque com
                          # network_mode: host o LiveKit enxergava TODAS as
                          # interfaces docker da maquina (bridges de outros
                          # projetos na mesma VPS) e tentava autodetectar/validar
                          # IP externo em cada uma, sobrando warnings e
                          # candidatos ICE invalidos com IPs privados.
  use_external_ip: false

turn:
  enabled: true      # TURN embutido do proprio LiveKit; substitui o coturn standalone
  udp_port: 3478

# Credenciais que o backend usa pra assinar os tokens de acesso (ver
# LiveKitTokenService, livekit.api-key/livekit.api-secret no application*.properties).
# Agora vem do .env (LIVEKIT_API_KEY/LIVEKIT_API_SECRET) via env var LIVEKIT_KEYS
# no docker-compose.yml, que sobrepoe o "keys:" abaixo - nao precisa editar aqui.
# Ao subir na VPS, troque os valores no .env (>= 32 caracteres) e replique o
# mesmo par em application-vps.properties - os dois precisam bater.
keys:
  devkey: devsecret_local_apenas_para_desenvolvimento_32
